apiVersion: apps/v1
kind: Deployment
metadata:
  name: elfaheem-frontend
  namespace: elfaheem
  labels:
    app: elfaheem-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elfaheem-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: elfaheem-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      affinity:
        # Keep the control plane (wk) free: land on the workers whenever
        # they can take the pod, but stay schedulable if they cannot.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["wk1", "wk2"]
        # One replica per node, so a single worker going down never takes
        # the whole landing page with it.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: elfaheem-frontend
      containers:
        - name: nginx
          image: ghcr.io/wkn00/elfaheem-landing:1.10.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elfaheem-frontend
  namespace: elfaheem
  labels:
    app: elfaheem-frontend
spec:
  selector:
    app: elfaheem-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
