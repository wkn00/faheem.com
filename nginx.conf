server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for text assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every header lives at server level on purpose: an add_header inside a
    # location block drops all inherited ones, and the internal redirect to
    # /index.html would have landed in exactly that block.

    # The site is a single document — never cache it
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # Security headers. CSS and JS are inline in index.html, hence
    # 'unsafe-inline'; fonts are the only third party the page talks to.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
}
